name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Every static asset is fetched with the version on the end of it, so a
      # release built from a tree that still says an older number serves new
      # CSS behind an old cache key and browsers keep the old one. That is not
      # hypothetical: 0.19 through 0.23 all shipped calling themselves 0.18.0.
      - name: The tag and the version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(sed -n "s/^__version__ = \"\(.*\)\"$/\1/p" pitwatch/__init__.py)
          if [ "$tagged" != "$declared" ]; then
            echo "Tagged $GITHUB_REF_NAME but __version__ says $declared" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but nothing
      # from a fork should be able to publish an image.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
