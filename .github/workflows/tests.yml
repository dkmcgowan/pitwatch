name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point finishing a run nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    # The real thing, not a stand in. The migrations create hypertables,
    # continuous aggregates and retention policies, none of which plain
    # Postgres has and none of which a mock would catch being wrong.
    services:
      db:
        image: timescale/timescaledb:2.29.2-pg17
        env:
          POSTGRES_DB: pitwatch_test
          POSTGRES_USER: pitwatch
          POSTGRES_PASSWORD: pitwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitwatch -d pitwatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PITWATCH_TEST_DATABASE_URL: postgresql://pitwatch:pitwatch@localhost:5432/pitwatch_test
      # Turns a missing database into a failure rather than a quiet skip, which
      # is the difference between CI covering the migrations and CI pretending to.
      PITWATCH_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check pitwatch tests scripts
      - name: Ruff format
        run: ruff format --check pitwatch tests scripts
      - name: House style
        run: python scripts/check_style.py
      - name: Pytest
        run: pytest --cov=pitwatch --cov-report=term-missing
