# PitWatch, two containers: the application and its database.
#
# Copy .env.example to .env, set POSTGRES_PASSWORD to something of your own,
# then `docker compose up -d` and open http://<host>:8080.
#
# The database is not published on a host port. Nothing outside this stack needs
# to reach Postgres, and an ejector pump monitor is not worth exposing a
# database to the network for. Uncomment the ports block below if you want to
# point a client at it, and understand what you are doing when you do.

name: pitwatch

services:
  db:
    # Floats Timescale releases, and deliberately pins the Postgres major at 17.
    # Plain `latest` would follow Postgres majors too, and Postgres refuses to
    # start on a data directory written by an older major, so that tag moving
    # would take the database down and need a dump and restore to undo.
    #
    # Not the -oss tag: compression, retention policies and continuous aggregate
    # refresh are Community License features the -oss build does not have, so
    # migration 003 would fail on it.
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pitwatch
      POSTGRES_USER: pitwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Timescale's tuning script runs on first boot and picks settings from the
      # container's memory limit.
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pitwatch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwatch -d pitwatch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Publishing the database is optional and off by default. The application
    # does not need it: on this bridge network it reaches Postgres as `db:5432`,
    # container to container, and that never changes whatever you do here.
    #
    # Uncomment only to point a client such as psql or pgAdmin at it, and
    # understand that you are putting a database on the network when you do.
    # Set POSTGRES_HOST_PORT in .env if 5432 is already taken. Binding to
    # 127.0.0.1 keeps it on this machine; drop that prefix to expose it to the
    # LAN, which you probably should not.
    # ports:
    #   - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  app:
    # `latest` while you are setting this up, so that a fix is one `pull` away.
    # Pin a version, for example `0.2.2`, once it is watching a real pump: a tag
    # that moves under you is not what you want standing between a basement and
    # a flood.
    image: ghcr.io/dkmcgowan/pitwatch:latest
    # Building from a checkout instead of pulling the published image:
    # build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PITWATCH_DATABASE_URL: postgresql://pitwatch:${POSTGRES_PASSWORD}@db:5432/pitwatch
      PITWATCH_TIMEZONE: ${PITWATCH_TIMEZONE:-America/New_York}
      PITWATCH_LOG_LEVEL: ${PITWATCH_LOG_LEVEL:-INFO}
      # Turn on when a proxy in front is terminating TLS. It marks the session
      # cookie Secure, so it is never sent over plain HTTP.
      PITWATCH_SECURE_COOKIES: ${PITWATCH_SECURE_COOKIES:-false}
      # Optional. Set these and the first boot comes up already pointed at the
      # hardware, so the setup wizard has less to ask. They are read once, when
      # the settings are empty; after that the settings page is in charge.
      PITWATCH_SEED_SHELLY_HOST: ${SHELLY_HOST:-}
      PITWATCH_SEED_WAVESHARE_HOST: ${WAVESHARE_HOST:-}
    ports:
      # Left of the colon is the port on your host, and the only one worth
      # changing. Right of it is the port inside the container, which stays
      # 8080: nothing else is in there to collide with, and the image's health
      # check expects it.
      #
      # Deliberately not called PITWATCH_PORT. That name is the application's
      # own setting for which port to bind, and it is already set to 8080 in the
      # image. Using it here as well would mean the same name meant the host
      # side in one file and the container side in another, and anyone who
      # passed it through to the app would map a port the app was no longer
      # listening on.
      - "${PITWATCH_HOST_PORT:-8080}:8080"

volumes:
  pitwatch-db:
