# PitWatch: the application and its database.
#
# Copy .env.example to .env, put a password in it, then `docker compose up -d`
# and open http://<host>:8080.
#
# The application and the broker run on the host's network, because the whole
# job is talking to a meter and an I/O module on your LAN and that is the
# arrangement least likely to be in the way. Everything is in this file; change
# what you need to.

name: pitwatch

services:
  db:
    # Floats Timescale releases and pins the Postgres major at 17. Plain
    # `latest` would follow Postgres majors too, and Postgres refuses to start
    # on a data directory written by an older major, so that tag moving would
    # take the database down and need a dump and restore to undo.
    #
    # Not the -oss tag: compression, retention policies and continuous aggregate
    # refresh are Community License features it does not have.
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pitwatch
      POSTGRES_USER: pitwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pitwatch-db:/var/lib/postgresql/data
    ports:
      # Loopback only. The application reaches the database here because it is
      # on the host's network; nothing else can, on this machine or off it.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwatch -d pitwatch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mqtt:
    # The broker the panel module publishes to. The module opens the connection
    # and speaks when an input changes, so nothing polls it and nothing has to
    # reach into the panel; the one thing that has to be reachable is this.
    image: eclipse-mosquitto:2
    restart: unless-stopped

    # On the host's network, so the module can reach the broker at this
    # machine's own LAN address. Unlike the database, this one cannot be on
    # loopback: the whole point is that something else connects to it.
    network_mode: host

    environment:
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-pitwatch}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}

    # Mosquitto is configured by a file and the file cannot read the
    # environment, so the file is written here from the values above. That
    # keeps the port and the password in .env with everything else, and means
    # changing either is an edit and a restart rather than a second procedure
    # with mosquitto_passwd.
    #
    # Anonymous connections are refused. A broker on the LAN with them allowed
    # is a broker anyone on the LAN can publish a high water alarm to.
    command:
      - sh
      - -c
      - |
        set -e
        {
          echo "listener $$MQTT_PORT"
          echo "allow_anonymous false"
          echo "password_file /mosquitto/data/passwd"
          echo "persistence true"
          echo "persistence_location /mosquitto/data/"
        } > /mosquitto/data/pitwatch.conf
        # Removed first. The password file lives in the volume, so it is still
        # there on the second start, and mosquitto_passwd refuses to create one
        # over a file that exists rather than replacing it. Regenerating from
        # .env every start is the whole point, so the old one is never wanted.
        rm -f /mosquitto/data/passwd /mosquitto/data/passwd.tmp
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        # Mosquitto drops to its own user after reading the config, and refuses
        # to start on a password file it cannot then read. These files are
        # written after the image's entrypoint has done its own chown, so they
        # are the two it would miss.
        chown mosquitto:mosquitto /mosquitto/data/passwd /mosquitto/data/pitwatch.conf || true
        chmod 0600 /mosquitto/data/passwd
        exec mosquitto -c /mosquitto/data/pitwatch.conf

    volumes:
      - pitwatch-mqtt:/mosquitto/data

  app:
    # `latest` while you are setting this up, so a fix is one `pull` away. Pin a
    # version once it is watching a real pump.
    image: ghcr.io/dkmcgowan/pitwatch:latest
    restart: unless-stopped

    # On the host's network, so the Shelly is reachable at its own address with
    # nothing in between. To run it on Docker's own network instead, drop this
    # line, add `ports: ["8080:8080"]`, and change the two 127.0.0.1 addresses
    # below, in the database URL and the broker seed, to db and mqtt.
    network_mode: host

    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      PITWATCH_DATABASE_URL: postgresql://pitwatch:${POSTGRES_PASSWORD}@127.0.0.1:5432/pitwatch

      # The port to reach PitWatch on. On host networking this is a host port
      # directly, with no mapping to move it.
      PITWATCH_PORT: 8080

      # Used for every timestamp shown. Storage is always UTC.
      PITWATCH_TIMEZONE: America/New_York

      # INFO is right for normal running. DEBUG logs every reading the Shelly
      # pushes, which is a line a second.
      PITWATCH_LOG_LEVEL: INFO

      # Turn on if a reverse proxy in front is terminating TLS. It marks the
      # session cookie Secure, so a browser will not send it over plain HTTP.
      PITWATCH_SECURE_COOKIES: "false"

      # Which addresses may say, through X-Forwarded-For, who the client really
      # is. Set it to your reverse proxy if it runs somewhere else. Never "*":
      # anyone able to reach the port could then claim to be any address, which
      # defeats the sign in throttling.
      PITWATCH_TRUSTED_PROXIES: 127.0.0.1,::1

      # Written into the settings table once, on a first boot with nothing
      # saved, and ignored from then on. They are here so that a fresh install
      # comes up already talking to the broker above instead of asking you to
      # retype what is already in .env. Change them later in the settings page.
      PITWATCH_SEED_BROKER_HOST: 127.0.0.1
      PITWATCH_SEED_BROKER_PORT: ${MQTT_PORT:-1883}
      PITWATCH_SEED_BROKER_USERNAME: ${MQTT_USERNAME:-pitwatch}
      PITWATCH_SEED_BROKER_PASSWORD: ${MQTT_PASSWORD}

volumes:
  pitwatch-db:
  pitwatch-mqtt:
