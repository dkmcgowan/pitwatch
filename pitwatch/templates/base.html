<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}PitWatch{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true"></span>
    PitWatch
  </a>
  <nav>
    <a href="/" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="/history" {% if active == 'history' %}class="active"{% endif %}>History</a>
    <a href="/alerts" {% if active == 'alerts' %}class="active"{% endif %}>Alerts</a>
    <a href="/settings" {% if active == 'settings' %}class="active"{% endif %}>Settings</a>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>{{ site.name }}{% if site.location %} &middot; {{ site.location }}{% endif %}</span>
  <span>PitWatch {{ version }}</span>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
