[project]
name = "pitwatch"
dynamic = ["version"]
description = "Monitoring and alerting for a duplex ejector pump panel"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "David McGowan" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# One place to change, so the footer, the image tag and the query string
# that busts a stale stylesheet cannot disagree.
[tool.setuptools.dynamic]
version = { attr = "pitwatch.__version__" }

[tool.setuptools.packages.find]
include = ["pitwatch*"]

[tool.setuptools.package-data]
pitwatch = ["migrations/*.sql", "static/*", "templates/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "BLE", "RUF"]
ignore = [
    # Long lines in SQL literals and log messages are more readable unwrapped.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The whole job of this script is to hold the characters it is looking for.
"scripts/check_style.py" = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette's test client reads anyio.abc.BlockingPortal at import time and
    # anyio 4.15 deprecated that alias, so a bare "error" turns somebody else's
    # rename into a run that cannot collect a single test. Nothing in here can
    # fix it and pinning anyio would freeze a transitive dependency to dodge a
    # warning. Narrow to the one message, so the day starlette catches up this
    # line starts doing nothing and the rest of the rule still bites.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
